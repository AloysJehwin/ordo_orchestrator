# Render Blueprint (https://render.com/docs/blueprint-spec): Ordo as one Docker web service with managed Postgres.
# Ordo is a long-running process (engine timer, Server-Sent Events), so it runs as a web service, not serverless.
# New Blueprint in the Render dashboard -> this repo -> Render prompts once for every `sync: false` value below.
# Leave the ones you don't use empty (Ordo treats an empty value as unset); later changes go in the dashboard
# (Environment), because Render reads `sync: false` values only when the Blueprint is first created.
# The variables mirror server/.env.example (docs/environments.md lists what each one does).

databases:
  - name: ordo-db
    plan: 0.1c-256mb
    region: virginia
    postgresMajorVersion: "17"
    databaseName: ordo
    user: ordo
    # private network only: Ordo reaches it inside Render; add your IP here (or in the dashboard) to connect from outside
    ipAllowList: []

envVarGroups:
  # Non-secret settings of the long-running service. Edit them in the group; preview environments get them too.
  - name: ordo-runtime
    envVars:
      # the background timer pulls data and advances runs even when nobody has the console open
      - key: ENGINE_TIMER
        value: "on"
      - key: TICK_MS
        value: "5000"
      # every machine's body runs in its own Vercel Sandbox microVM (needs the three VERCEL_* values below)
      - key: BODY_RUNTIME
        value: sandbox
      - key: STAGE_MACHINES
        value: required

services:
  - type: web
    name: ordo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 1c-2g
    region: virginia
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ordo-db
          property: connectionString
      - fromGroup: ordo-runtime
      # PORT and RENDER_EXTERNAL_URL come from Render: public links (passports, QR codes, proof-of-work commands, the
      # address machine bodies call) use RENDER_EXTERNAL_URL unless PUBLIC_URL names your own domain.
      # ZG_ROUTER_AUDIO_MODEL: unset means whisper-large-v3 in private mode (none on standard routing); empty turns voice notes off.
      # Machine bodies on Vercel Sandbox (docs/machines.md)
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_TEAM_ID
        sync: false
      - key: VERCEL_SANDBOX_PROJECT
        sync: false
      # Core and accounts
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_ADDRESS
        sync: false
      - key: SESSION_TTL_HOURS
        sync: false
